name: "linux machine e2e (#29971)"

# Fork-only workflow: runs the stale API socket e2e test on Linux (QEMU)
# against main, main + the stop fix, and the full fix.

on:
  push:
    branches:
      - linux-e2e-29971
  workflow_dispatch:

permissions:
  contents: read

env:
  BASE: 85f068d88f8c7d40f009cf7e0d56b6273696c922

jobs:
  machine-linux:
    name: ${{ matrix.variant }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        variant: [main, stop-fix-only, full-fix]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 10

      - name: "Select code for ${{ matrix.variant }}"
        run: |
          case "${{ matrix.variant }}" in
            main)
              git checkout "$BASE" -- pkg/machine/shim/networking.go pkg/machine/gvproxy_unix.go ;;
            stop-fix-only)
              git checkout "$BASE" -- pkg/machine/shim/networking.go ;;
            full-fix) ;;
          esac
          git status --short
          git diff "$BASE" --stat -- pkg/machine

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: "Install gvproxy"
        run: |
          VERSION=$(go list -m -f '{{.Version}}' github.com/containers/gvisor-tap-vsock)
          echo "Installing gvproxy $VERSION"
          sudo mkdir -p /usr/local/libexec/podman/
          sudo curl --fail -L -o /usr/local/libexec/podman/gvproxy "https://github.com/containers/gvisor-tap-vsock/releases/download/$VERSION/gvproxy-linux-amd64"
          sudo chmod +x /usr/local/libexec/podman/gvproxy

      - name: "Install dependencies"
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system virtiofsd
          sudo ln -sfr /usr/libexec/virtiofsd /usr/local/libexec/podman/virtiofsd

      - name: "Configure registries.conf"
        run: sudo rm -f /etc/containers/registries.conf

      - name: "Fix kvm permissions"
        run: |
          ls -l /dev/kvm
          sudo chmod 666 /dev/kvm

      - name: "Build podman-remote"
        run: make podman-remote

      - name: "Run stale API socket test"
        env:
          MACHINE_TEST_TIMEOUT: "300"
        run: make localmachine FOCUS="client connect to machine socket"
